<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boi · review</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preload" href="../fonts/inter-vi.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/app.css">
<link rel="stylesheet" href="./review.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='25' x='3' font-size='26' font-family='-apple-system,system-ui,sans-serif' font-weight='600'>b</text></svg>">
</head>
<body>

<header class="toolbar">
  <h1 class="wordmark">boi · review</h1>
  <p class="progress"><output id="count">0 / 0</output></p>
  <button type="button" class="icon-button" id="theme" data-theme="auto" aria-label="Appearance: auto. Change it.">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
  <button type="button" class="chip" id="export">Export</button>
</header>

<main>
  <div class="bar"><div id="fill"></div></div>

  <section id="card" class="card" aria-live="polite">
    <p class="tagline"><span id="tags"></span></p>
    <h2 id="word">—</h2>
    <p class="phones" id="phones"></p>

    <p class="prompt">Which reading is right?</p>
    <ul class="choices" id="choices"></ul>

    <form id="other" class="other">
      <label class="visually-hidden" for="custom">Something else</label>
      <input id="custom" type="text" lang="vi" spellcheck="false" placeholder="Something else, in Vietnamese">
      <button type="submit" class="submit" aria-label="Use this reading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="error" id="error" hidden></p>

    <div class="row">
      <button type="button" class="chip" id="skip">Skip</button>
      <button type="button" class="chip" id="back">Back</button>
      <span class="hint">1–5 to pick · Enter for the first · S to skip</span>
    </div>
  </section>

  <section id="done" class="card" hidden>
    <h2>That is the sheet</h2>
    <p class="state">Export it, drop it over <code>data/review/sheet_001.csv</code>, then run
      <code>uv run scripts/merge_review.py data/review/sheet_001.csv</code>.</p>
    <button type="button" class="chip" id="export2">Export</button>
  </section>
</main>

<script src="./review.js" type="module"></script>
</body>
</html>
