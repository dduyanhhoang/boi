[project]
name = "boi"
version = "0.1.0"
description = "English words as Vietnamese speakers read them (tieng Anh boi)"
readme = "README.md"
authors = [
    { name = "D Duy Anh Hoang", email = "137117837+dduyanhhoang@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cmudict>=1.1.3",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
