name: Pages

on:
  push:
    branches: [main]
    # eval/** matters too: run_ngo.py is imported by tests, so a change there
    # can break the build without touching anything else listed here.
    paths: ["app/**", "src/**", "data/**", "scripts/**", "tests/**", "eval/**",
            ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # app/scripts/oov.js reruns the pipeline in the browser for words the shards
  # do not have. This job runs it against the Python over a few thousand words
  # and blocks the deploy if they disagree.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run scripts/build_tables.py
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # app/data is generated, never committed, so the published readings
      # always match the rules in src/boi at this commit.
      - run: uv run scripts/build_web_data.py
      - run: uv run scripts/build_tables.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
