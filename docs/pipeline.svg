    <tspan x="120" dy="0">English word</tspan>
    <tspan x="120" dy="20">schedule</tspan>
  </text>
  <text x="435" y="94" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="435" dy="0">Phones</tspan>
    <tspan x="435" dy="20">S K EH JH UH L</tspan>
    <tspan x="435" dy="20">(CMUdict, a compound split,</tspan>
    <tspan x="435" dy="20">or the spelling)</tspan>
  </text>
  <text x="820" y="94" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="820" dy="0">Syllables</tspan>
    <tspan x="820" dy="20">[S] [K EH] [JH UH L]</tspan>
    <tspan x="820" dy="20">(onset, nucleus, coda;</tspan>
    <tspan x="820" dy="20">clusters broken, doubling)</tspan>
  </text>
  <text x="1195" y="104" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="1195" dy="0">Vietnamese letters</tspan>
    <tspan x="1195" dy="20">sờ · ke · đua</tspan>
    <tspan x="1195" dy="20">(from sound and spelling)</tspan>
  </text>
  <text x="1545" y="104" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="1545" dy="0">Tones</tspan>
    <tspan x="1545" dy="20">huyền · ngang · huyền</tspan>
    <tspan x="1545" dy="20">(from syllable shape)</tspan>
  </text>
  <text x="1885" y="114" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#2f9e44" text-anchor="middle">
    <tspan x="1885" dy="0">Rank</tspan>
    <tspan x="1885" dy="20">legal syllables only</tspan>
  </text>
  <text x="2180" y="214" font-family="Virgil, Segoe UI Emoji, Helvetica, Arial, sans-serif" font-size="16" fill="#e8590c" text-anchor="middle">
